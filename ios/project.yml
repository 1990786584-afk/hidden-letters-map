name: ZFxFLoveMap

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  ZFxFLoveMap:
    type: application
    platform: iOS
    sources:
      - path: ZFxFLoveMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zfxf.lovemap
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "用于藏宝地图里确认到访地点；只有你主动点击「分享这一次」时，才会把当前坐标发送到私人服务器。"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
